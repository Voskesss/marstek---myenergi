<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myEnergy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0e1a; overflow: hidden; height: 100vh; }
    .view { position: fixed; inset: 0; width: 100%; height: 100%; border: none; z-index: 1; }
    .view.behind { z-index: 0; }
    .nav-bar {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(30,40,60,0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      display: flex;
      overflow: hidden;
    }
    .nav-btn {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      cursor: pointer;
      border: none;
      background: none;
      transition: all 0.2s;
      font-family: -apple-system, system-ui, sans-serif;
    }
    .nav-btn.active {
      color: #fff;
      background: rgba(59,130,246,0.5);
    }
    .nav-btn:hover:not(.active) {
      color: #e2e8f0;
      background: rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>
  <iframe id="flowFrame" class="view" src="/flow.html" allow="fullscreen"></iframe>
  <iframe id="dashFrame" class="view behind" src="/dashboard" allow="fullscreen"></iframe>
  <iframe id="rapportFrame" class="view behind" src="" allow="fullscreen"></iframe>

  <div class="nav-bar">
    <button class="nav-btn active" id="btnFlow" onclick="showView('flow')">⚡ Flow</button>
    <button class="nav-btn" id="btnDash" onclick="showView('dash')">🎛️ Dashboard</button>
    <button class="nav-btn" id="btnRapport" onclick="showView('rapport')">📊 Rapport</button>
  </div>

  <script>
    function showView(view) {
      const frames = {
        flow: document.getElementById('flowFrame'),
        dash: document.getElementById('dashFrame'),
        rapport: document.getElementById('rapportFrame')
      };
      const btns = {
        flow: document.getElementById('btnFlow'),
        dash: document.getElementById('btnDash'),
        rapport: document.getElementById('btnRapport')
      };
      // Lazy load rapport
      if (view === 'rapport' && !frames.rapport.src.includes('/rapport')) {
        frames.rapport.src = '/rapport';
      }
      for (const [k, f] of Object.entries(frames)) {
        f.classList.toggle('behind', k !== view);
      }
      for (const [k, b] of Object.entries(btns)) {
        b.classList.toggle('active', k === view);
      }
    }

    // Fullscreen toggle with F key
    document.addEventListener('keydown', e => {
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      }
    });
  </script>
</body>
</html>
