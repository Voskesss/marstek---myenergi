<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myEnergy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0e1a; overflow: hidden; height: 100vh; }
    .view { position: fixed; inset: 0; width: 100%; height: 100%; border: none; z-index: 1; }
    .view.behind { z-index: 0; }
    .nav-toggle {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(30,40,60,0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      display: flex;
      overflow: hidden;
    }
    .nav-btn {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      cursor: pointer;
      border: none;
      background: none;
      transition: all 0.2s;
      font-family: -apple-system, system-ui, sans-serif;
    }
    .nav-btn.active {
      color: #fff;
      background: rgba(59,130,246,0.5);
    }
    .nav-btn:hover:not(.active) {
      color: #e2e8f0;
      background: rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>
  <iframe id="flowFrame" class="view" src="/flow.html" allow="fullscreen"></iframe>
  <iframe id="dashFrame" class="view behind" src="/dashboard" allow="fullscreen"></iframe>

  <div class="nav-toggle">
    <button class="nav-btn active" id="btnFlow" onclick="showView('flow')">⚡ Flow</button>
    <button class="nav-btn" id="btnDash" onclick="showView('dash')">🎛️ Dashboard</button>
  </div>

  <script>
    function showView(view) {
      const flow = document.getElementById('flowFrame');
      const dash = document.getElementById('dashFrame');
      const btnF = document.getElementById('btnFlow');
      const btnD = document.getElementById('btnDash');
      if (view === 'flow') {
        flow.classList.remove('behind');
        dash.classList.add('behind');
        btnF.classList.add('active');
        btnD.classList.remove('active');
      } else {
        dash.classList.remove('behind');
        flow.classList.add('behind');
        btnD.classList.add('active');
        btnF.classList.remove('active');
      }
    }

    // Fullscreen toggle with F key
    document.addEventListener('keydown', e => {
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      }
    });
  </script>
</body>
</html>
